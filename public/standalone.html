    // Web Audio Chime
    function playNotificationChime() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.frequency.setValueAtTime(659.25, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.08, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.3);
      } catch (e) {}
    }

    // Download document as text
    function downloadDocument(fileName, title, content) {
      const fullText = `========================================================\nTALIBILM ACADEMIC LIBRARY\nTitle: ${title}\n========================================================\n\n${content}`;
      const blob = new Blob([fullText], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = fileName.endsWith('.txt') ? fileName : `${fileName}.txt`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    // Download SVG as PNG image using Canvas
    function downloadSvgAsPng(svgElementId, filename = 'diagram.png') {
      const container = document.getElementById(svgElementId);
      if (!container) return;
      const svg = container.querySelector('svg');
      if (!svg) return;

      const svgData = new XMLSerializer().serializeToString(svg);
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      const img = new Image();

      canvas.width = 1600;
      canvas.height = 960;

      img.onload = () => {
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        const pngUrl = canvas.toDataURL('image/png');
        const downloadLink = document.createElement('a');
        downloadLink.href = pngUrl;
        downloadLink.download = filename;
        document.body.appendChild(downloadLink);
        downloadLink.click();
        document.body.removeChild(downloadLink);
      };

      img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgData)));
    }

                                    : 'border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900'
                                }`}
                              >
                                {opt}
                              </button>
                            ))}
                          </div>
                        </div>
                      ))}

                          onClick={() => { setQuizChecked(true); playNotificationChime(); showToast('Quiz evaluated!'); }}

                        </button>
                      </div>
                    </div>

                {/* MODE 4: TIMETABLE PLANNER */}
                {aiMode === 'timetable' && (

Target: A+ Grade Topper (${targetBoard})

📅 Phase 1 (Days 1-10): Fundamental Theory & Concept Mastery
• Daily 6:00 AM - 8:00 AM: Memorize definitions, SI units, and laws.
• Daily 4:00 PM - 6:00 PM: Step-by-step textbook derivations.

📅 Phase 2 (Days 11-20): High-Yield Numericals & Diagrams
• Daily 8:00 PM - 10:30 PM: Solve past 5 years board numerical problems.
• Practice scientific diagrams on unruled and ruled notebook sheets.

📅 Phase 3 (Days 21-27): Board Past Papers & Time Management
• Solve 3 full-length 2 hour 45 min timed board papers.

📅 Phase 4 (Days 28-30): Golden Formula Sheet & Final Glance
• Revise one-page summary sheets and rest well before exam day.`);

BOARD MODEL EXAMINATION PAPER 2026
Subject: Physics / Science  |  Target: ${targetBoard}
Time: 2 Hours 45 Mins       |  Total Marks: 85
=============================================================

SECTION A: OBJECTIVE MCQs (12 Marks)
1. The dimension of work is:
   (A) [MLT⁻¹]    (B) [ML²T⁻²]    (C) [ML²T⁻¹]    (D) [M²LT⁻²]   [Ans: B]
2. The angle at which horizontal range of projectile is maximum:
   (A) 30°        (B) 45°         (C) 60°         (D) 90°        [Ans: B]
3. When body moves in a circular path, work done by centripetal force is:
   (A) Zero       (B) Positive    (C) Negative    (D) Maximum    [Ans: A]

SECTION B: SHORT QUESTIONS (Attempt any 8 - 44 Marks)
Q1. State Work-Energy Principle and write its mathematical equation.
Q2. Why is maximum horizontal range achieved at 45 degrees?
Q3. State the law of conservation of momentum with an example.
Q4. Differentiate between elastic and inelastic collision.
Q5. Derive formula for height of a projectile.

SECTION C: EXTENSIVE QUESTIONS (Attempt any 2 - 24 Marks)
Q6 (a) State and prove Bernoulli's theorem for fluid flow. (5 Marks)
Q6 (b) A car moves with 20 m/s and stops in 4 seconds. Calculate distance. (3 Marks)

💡 CHIEF EXAMINER MARKING TIPS:
• Always draw neat diagrams using pencil with clear labels.
• Mention SI units in the final numerical line to avoid losing 0.5 mark.`);
                          showToast('Model Paper Generated!');
                        }}
                        className="px-5 py-2.5 bg-brand-600 hover:bg-brand-700 text-white rounded-xl text-xs font-semibold"
                      >
                        Generate Board Paper
                      </button>
                      {generatedPaper && (
                        <button onClick={() => window.print()} className="px-4 py-2.5 bg-slate-200 dark:bg-slate-800 text-slate-800 dark:text-white rounded-xl text-xs font-semibold">
                          Print Paper
                        </button>
                      )}
                    </div>

                    {generatedPaper && (
                      <div className="p-5 rounded-xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 text-xs sm:text-sm font-mono whitespace-pre-wrap leading-relaxed text-slate-800 dark:text-slate-200">
                        {generatedPaper}
                      </div>
                    )}
                  </div>
                )}
              </div>

            {/* ========================================================= */}
            {/* TAB 4: PLAYABLE VIDEO LECTURES */}
            {/* ========================================================= */}
            {activeTab === 'videos' && (

                <div className="flex items-center justify-between mb-6">

                    <h2 className="text-2xl font-bold font-display text-slate-900 dark:text-white">Video Lectures Hub</h2>

                      <div className="aspect-video w-full bg-black">

                      <div className="p-5 flex-1 flex flex-col justify-between">

                          <div className="flex items-center justify-between text-xs text-slate-500 mb-1">
                            <span>{v.className} · {v.subject}</span>
                            <span>⏱ {v.duration}</span>

                          <p className="text-xs text-slate-600 dark:text-slate-300 mt-2 line-clamp-2">{v.description}</p>

                                  comments: [{ id: Date.now().toString(), authorName: 'Student', comment: c }, ...item.comments]
                                } : item));
                                showToast('Comment posted!');

                            }}

                            💬 {v.comments.length} Comments
                          </button>
                          <button
                            onClick={() => showToast(`Link copied for "${v.title}"!`)}
                            className="text-slate-600 dark:text-slate-300 font-semibold hover:text-brand-600"

                            🔗 Share

                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </main>

          {/* ========================================================= */}
          {/* MOBILE BOTTOM NAVIGATION DOCK (ALWAYS ACCESSIBLE!) */}

              { id: 'forum', label: 'Doubts', icon: '💬' },
              { id: 'ai', label: 'AI Tutor', icon: '✨' },

                }`}
              >
                <span className="text-base">{tab.icon}</span>
                <span className="text-[10px] mt-0.5">{tab.label}</span>
              </button>
            ))}
            <button
              onClick={() => setIsSettingsOpen(true)}
              className="flex flex-col items-center py-1 px-3 rounded-xl text-slate-500 dark:text-slate-400"
            >
              <span className="text-base">⚙️</span>
              <span className="text-[10px] mt-0.5">Settings</span>

          {/* ========================================================= */}
          {/* SETTINGS MODAL */}
          {/* ========================================================= */}

                  <button onClick={() => setIsSettingsOpen(false)} className="text-slate-400 hover:text-slate-600">✕</button>
                </div>

                <div className="py-4 space-y-4">
                  <div>
                    <label className="text-xs font-semibold text-slate-500 block mb-2">Display Theme</label>
                    <div className="flex gap-2">
                      <button onClick={() => setIsDarkMode(false)} className={`flex-1 py-2 rounded-xl text-xs font-semibold border ${!isDarkMode ? 'border-brand-600 bg-brand-50 text-brand-700' : 'border-slate-200 dark:border-slate-800'}`}>Light</button>
                      <button onClick={() => setIsDarkMode(true)} className={`flex-1 py-2 rounded-xl text-xs font-semibold border ${isDarkMode ? 'border-brand-600 bg-brand-50 text-brand-700' : 'border-slate-200 dark:border-slate-800'}`}>Dark</button>
                    </div>
                  </div>

                  <div>
                    <label className="text-xs font-semibold text-slate-500 block mb-2">Accent Color Palette</label>
                    <div className="grid grid-cols-3 gap-2">
                      {[
                        { id: 'indigo', name: 'Indigo' },
                        { id: 'emerald', name: 'Emerald' },
                        { id: 'rose', name: 'Rose' },
                        { id: 'violet', name: 'Violet' },
                        { id: 'cyan', name: 'Cyan' },
                        { id: 'amber', name: 'Amber' }
                      ].map(c => (
                        <button
                          key={c.id}
                          onClick={() => { setAccentColor(c.id); showToast(`Accent changed to ${c.name}!`); }}
                          className={`p-2.5 rounded-xl border text-xs font-semibold ${accentColor === c.id ? 'border-brand-600 bg-brand-50 text-brand-700' : 'border-slate-200 dark:border-slate-800'}`}

                  </div>

                  <div>
                    <label className="text-xs font-semibold text-slate-500 block mb-2">Target Board Examination</label>
                    <select
                      value={targetBoard}
                      onChange={e => setTargetBoard(e.target.value)}
                      className="w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-xs"
                    >
                      <option>Punjab Board (BISE)</option>
                      <option>Federal Board (FBISE)</option>
                      <option>Sindh Board (BIEK)</option>
                      <option>KPK Board</option>
                      <option>Cambridge (O/A Level)</option>
                      <option>MDCAT / PMC Scheme</option>
                    </select>
                  </div>
                </div>

                <div className="pt-3 border-t border-slate-100 dark:border-slate-800 flex justify-end">
                  <button onClick={() => setIsSettingsOpen(false)} className="px-5 py-2 bg-brand-600 text-white rounded-xl text-xs font-semibold">
                    Apply & Close
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ========================================================= */}
          {/* VIEW NOTE PREVIEW MODAL */}
          {/* ========================================================= */}
          {previewMat && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/70 backdrop-blur-sm">
              <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl w-full max-w-2xl max-h-[85vh] flex flex-col p-6 shadow-2xl">

                  <div>
                    <span className="text-xs font-bold text-brand-600">{previewMat.className} · {previewMat.subject}</span>
                    <h3 className="font-bold text-base text-slate-900 dark:text-white mt-0.5">{previewMat.title}</h3>
                  </div>
                  <button onClick={() => setPreviewMat(null)} className="text-slate-400 hover:text-slate-600 text-base">✕</button>
                </div>
                <div className="flex-1 overflow-y-auto py-4 text-xs sm:text-sm font-mono whitespace-pre-wrap text-slate-800 dark:text-slate-200 leading-relaxed bg-slate-50 dark:bg-slate-800/40 p-4 rounded-xl mt-3">

                <div className="pt-3 border-t border-slate-100 dark:border-slate-800 flex justify-end gap-2">

                  <button
                    onClick={() => {
                      downloadDocument(previewMat.fileName, previewMat.title, previewMat.sampleContent);

                    Download Note

                <form
                  onSubmit={e => {
                    e.preventDefault();
                    const form = e.target;
                    const newMat = {
                      id: Date.now().toString(),
                      title: form.title.value,
                      description: form.desc.value,
                      className: form.className.value,
                      subject: form.subject.value,
                      type: 'Notes',
                      uploaderName: 'Student Contributor',
                      rating: 5.0,
                      downloads: 0,
                      fileName: `${form.title.value.replace(/\s+/g, '_')}.pdf`,

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="text-xs font-semibold text-slate-500">Class</label>
                      <select name="className" className="w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-xs mt-1">
                        {CLASSES.filter(c => c !== 'All Classes').map(c => <option key={c}>{c}</option>)}
                      </select>
                    </div>
                    <div>
                      <label className="text-xs font-semibold text-slate-500">Subject</label>
                      <select name="subject" className="w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-xs mt-1">
                        {SUBJECTS.filter(s => s !== 'All Subjects').map(s => <option key={s}>{s}</option>)}
                      </select>
                    </div>
                  </div>
                  <div>
                    <label className="text-xs font-semibold text-slate-500">Short Description</label>
                    <input name="desc" placeholder="Chapter summary, derivations, formula sheet" className="w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-xs mt-1" />
                  </div>
                  <div>
                    <label className="text-xs font-semibold text-slate-500">Content / Key Notes</label>
                    <textarea name="content" rows={3} placeholder="Paste derivations or summary text..." className="w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-xs mt-1" />
                  </div>
                  <div className="pt-2 flex justify-end">
                    <button type="submit" className="px-5 py-2 bg-brand-600 text-white rounded-xl text-xs font-semibold">
                      Publish Notes
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* ========================================================= */}
          {/* ASK NEW DOUBT MODAL */}
          {/* ========================================================= */}
          {isAskDoubtOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/70 backdrop-blur-sm">
              <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl w-full max-w-md p-6 shadow-2xl">
                <div className="flex items-center justify-between pb-3 border-b border-slate-100 dark:border-slate-800">
                  <h3 className="font-bold text-base text-slate-900 dark:text-white">Ask Question in Forum</h3>
                  <button onClick={() => setIsAskDoubtOpen(false)} className="text-slate-400 hover:text-slate-600">✕</button>
                </div>
                <form
                  onSubmit={e => {
                    e.preventDefault();
                    const form = e.target;
                    const newD = {
                      id: Date.now().toString(),
                      title: form.title.value,
                      details: form.details.value,
                      className: form.className.value,
                      subject: form.subject.value,
                      authorName: 'Student',
                      createdAt: 'Just now',
                      upvotes: 1,
                      isSolved: false,
                      answers: []
                    };
                    setDoubts(prev => [newD, ...prev]);
                    setIsAskDoubtOpen(false);
                    showToast('Your question was posted to the forum!');
                  }}
                  className="py-4 space-y-3"
                >
                  <div>
                    <label className="text-xs font-semibold text-slate-500">Question Title</label>
                    <input name="title" required placeholder="e.g. Why is centripetal acceleration directed towards center?" className="w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-xs mt-1" />
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="text-xs font-semibold text-slate-500">Class</label>
                      <select name="className" className="w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-xs mt-1">
                        {CLASSES.filter(c => c !== 'All Classes').map(c => <option key={c}>{c}</option>)}
                      </select>
                    </div>
                    <div>
                      <label className="text-xs font-semibold text-slate-500">Subject</label>
                      <select name="subject" className="w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-xs mt-1">
                        {SUBJECTS.filter(s => s !== 'All Subjects').map(s => <option key={s}>{s}</option>)}
                      </select>
                    </div>
                  </div>
                  <div>
                    <label className="text-xs font-semibold text-slate-500">Details / What have you tried?</label>
                    <textarea name="details" rows={3} required placeholder="Provide context about what step you are stuck on..." className="w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-xs mt-1" />
                  </div>
                  <div className="pt-2 flex justify-end">
                    <button type="submit" className="px-5 py-2 bg-brand-600 text-white rounded-xl text-xs font-semibold">
                      Post Question
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* ========================================================= */}
          {/* STAR RATING MODAL */}
          {/* ========================================================= */}
          {ratingMat && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/70 backdrop-blur-sm">
              <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl w-full max-w-sm p-6 shadow-2xl text-center">
                <h3 className="font-bold text-base text-slate-900 dark:text-white">Rate Note</h3>
                <p className="text-xs text-slate-500 mt-1 line-clamp-1">{ratingMat.title}</p>

                <div className="flex justify-center gap-2 my-5 text-3xl">
                  {[1, 2, 3, 4, 5].map(star => (
                    <button
                      key={star}
                      onClick={() => setUserStars(star)}
                      className={`transition-transform hover:scale-125 ${userStars >= star ? 'text-amber-400' : 'text-slate-300 dark:text-slate-700'}`}
                    >
                      ★
                    </button>
                  ))}
                </div>

                <div className="flex justify-center gap-2">
                  <button onClick={() => setRatingMat(null)} className="px-4 py-2 border rounded-xl text-xs font-semibold">Cancel</button>
                  <button onClick={() => handleSaveRating(ratingMat.id)} className="px-5 py-2 bg-brand-600 text-white rounded-xl text-xs font-semibold">Submit Rating</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
